services:
  - type: web
    name: carepoint-voice-patient-agent
    env: node
    plan: starter
    buildCommand: npm install
    startCommand: node src/server.js
    disk:
      name: sqlite-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_PATH
        value: /opt/render/project/src/data/patients.db
      - key: VAPI_API_KEY
        sync: false
      - key: VAPI_PHONE_NUMBER
        sync: false
      - key: BASE_URL
        sync: false
